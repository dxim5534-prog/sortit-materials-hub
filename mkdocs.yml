site_name: SORT IT · Timor-Leste
site_description: >-
  Structured Operational Research and Training IniTiative (SORT IT) - Timor-Leste.
  Training materials for the operational research programme.
site_url: ""

copyright: >-
  Copyright &copy; 2026 SORT IT Timor-Leste ·
  Structured Operational Research and Training IniTiative

theme:
  name: material
  language: en
  custom_dir: overrides
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    logo: material/chart-timeline-variant
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.tooltips

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search

extra:
  generator: false

nav:
  - Home: index.md
  - Module 1: m1/index.md
  - Module 2: m2/index.md
  - Module 3:
      - m3/index.md
      - Day 1:
          - Introduction to Module 3: m3/module-introduction/index.md
          - Ethics approval process: m3/ethics-approval-review/index.md
      - Day 2:
          - Research impact and policy: m3/research-impact-policy/index.md
          - Introduction to data analysis: m3/data-analysis-intro/index.md
          - Using graphs and tables: m3/graphs-and-tables/index.md
          - Practice dataset: m3/practice-dataset/index.md
      - Day 3:
          - Interpretation of results: m3/interpretation/index.md
          - Structuring a written report: m3/writing-your-report/index.md
          - Structuring an oral presentation: m3/oral-presentation/index.md
      - Day 4:
          - Introduction and methods: m3/introduction-and-methods/index.md
          - Results and discussion: m3/results-and-discussion/index.md
          - Submitting for publication: m3/submitting-for-publication/index.md
      - Reference:
          - "Tools: Excel and R": m3/tools-excel-r/index.md
  - Schedule: cohorts/2026/index.md
  - Writing guide: guide/index.md
  - Add your materials: contribute/index.md
